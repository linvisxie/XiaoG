<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小G</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="会话列表">
      <div class="brand"><span class="brand-mark">G</span><span>小G</span></div>
      <button id="new-chat" class="new-chat">＋ 新建会话</button>
      <div id="conversation-list" class="conversation-list"></div>
      <button id="open-settings" class="settings-button">⚙ 设置</button>
    </aside>
    <main class="chat-area">
      <header class="topbar">
        <div><strong>小G</strong><span id="provider-note" class="provider-note">正在检查模型状态…</span></div>
        <label class="model-select-label">模型
          <select id="model-select" aria-label="选择模型">
            <option value="auto">Auto</option>
            <option value="deepseek">DeepSeek</option>
            <option value="terra">GPT-5.6 Terra</option>
          </select>
        </label>
      </header>
      <section id="messages" class="messages" aria-live="polite">
        <div class="empty-state"><div class="empty-logo">G</div><h1>你好，我是小G。</h1><p>我会把对话保存在你的电脑里。告诉我今天想一起完成什么？</p></div>
      </section>
      <footer class="composer-wrap">
        <form id="chat-form" class="composer">
          <textarea id="message-input" rows="1" placeholder="给小G发消息…（Enter 发送，Shift+Enter 换行）" aria-label="消息内容"></textarea>
          <div class="composer-actions"><span id="send-hint">小G可能会犯错，请核对重要信息。</span><button id="stop-button" type="button" class="secondary hidden">停止生成</button><button id="send-button" type="submit">发送</button></div>
        </form>
      </footer>
    </main>
  </div>
  <dialog id="settings-dialog">
    <form id="settings-form" method="dialog" class="settings-form">
      <div class="dialog-heading"><h2>小G 设置</h2><button type="button" class="icon-button" id="close-settings" aria-label="关闭">×</button></div>
      <label>统一人格 / System Prompt<textarea id="system-prompt" rows="8"></textarea></label>
      <label>用户资料（可选）<textarea id="user-profile" rows="5" placeholder="例如：我是历史学本科生，偏好中文解释。"></textarea></label>
      <p class="dialog-tip">这些内容保存在本机 SQLite 数据库，不会写入 DeepSeek Provider 代码。</p>
      <div class="dialog-actions"><button type="button" class="secondary" id="cancel-settings">取消</button><button type="submit">保存设置</button></div>
    </form>
  </dialog>
  <script src="/static/app.js"></script>
</body>
</html>
